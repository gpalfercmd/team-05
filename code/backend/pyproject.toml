[project]
name = "proof-of-aid-backend"
version = "0.1.0"
description = "Privacy-first evidence pipeline (EXIF strip, SHA-256, AES-GCM at rest), wallet login, event indexer and public verification API for Proof of Aid Team 05."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pillow>=10.4",
    "cryptography>=43",
    "eth-account>=0.13",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "proof-of-aid-shared",
    "web3>=8.0.0",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Application (not a distributable package): uv must not try to build this project.
[tool.uv]
package = false

[tool.uv.sources]
proof-of-aid-shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "anvil: needs Foundry (anvil + forge) on PATH; skipped automatically otherwise",
]
