[project]
name = "proof-of-aid-shared"
version = "0.1.0"
description = "Merkle recipe and cross-layer test vectors shared by the Proof of Aid contracts, backend and frontend."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pycryptodome>=3.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poa_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
